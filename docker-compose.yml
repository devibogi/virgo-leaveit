services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-leaveit_local_root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-leaveit}
      MARIADB_USER: ${MARIADB_USER:-leaveit}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-leaveit_local_pass}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

  app-dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      MARIADB_HOST: ${MARIADB_HOST:-db}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-leaveit}
      MARIADB_USER: ${MARIADB_USER:-leaveit}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-leaveit_local_pass}
    depends_on:
      - db

  app-prod:
    build:
      context: .
      target: prod
    ports:
      - "8080:80"
    depends_on:
      - db
    profiles:
      - prod

volumes:
  mariadb_data:
